{% extends 'base.html' %}{% block title %}Edit listing | KLU Marketplace{% endblock %}{% block content %}<section class="container form-page"><div class="form-intro"><p class="eyebrow">KEEP IT CURRENT</p><h1>Edit your<br><em>listing.</em></h1><p>Update the details students use to decide whether your item is right for them.</p></div><form class="listing-form" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>What are you listing?<input name="title" value="{{ product.title }}" required></label><div class="row g-3"><label class="col-md-6">Category<select name="category_id" required>{% for category in categories %}<option value="{{ category.id }}" {% if product.category_id == category.id %}selected{% endif %}>{{ category.display_name }}</option>{% endfor %}</select></label><label class="col-md-6">Condition<select name="condition" required><option value="">-- Select Condition --</option>{% for condition in ['New', 'Like New', 'Good', 'Fair', 'Used'] %}<option value="{{ condition }}" {% if product.condition == condition %}selected{% endif %}>{{ condition }}</option>{% endfor %}</select></label><label class="col-md-4">Price (₹)<input type="number" min="0" step="0.01" name="price" value="{{ product.price }}" required></label><label class="col-md-4">Rental price/day (₹)<input type="number" min="0" step="0.01" name="rental_price" value="{{ product.rental_price or '' }}"></label><label class="col-md-4">Listing type<select name="listing_type" required><option value="">-- Select Type --</option><option value="sale" {% if product.listing_type == 'sale' %}selected{% endif %}>Sell</option><option value="rent" {% if product.listing_type == 'rent' %}selected{% endif %}>Rent</option><option value="both" {% if product.listing_type == 'both' %}selected{% endif %}>Sell & rent</option></select></label></div><label>Description<textarea name="description" rows="5" required>{{ product.description }}</textarea></label><div class="row g-3"><label class="col-md-6">Pickup location<input name="location" value="{{ product.location }}" required></label><label class="col-md-6">Availability<input name="availability" value="{{ product.availability or '' }}"></label></div><label>Add more photos<input id="images" type="file" name="images" accept="image/png,image/jpeg,image/webp" multiple><span class="file-hint">Up to 6 images, 5 MB each. JPG, PNG or WEBP.</span></label><div id="preview" class="preview-grid"></div><button class="btn btn-ink">Save changes <i class="fa-solid fa-check"></i></button></form></section>{% endblock %}
