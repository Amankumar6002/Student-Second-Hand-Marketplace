{% extends 'base.html' %}{% block title %}List an item | KLU Marketplace{% endblock %}{% block content %}<section class="container form-page"><div class="form-intro"><p class="eyebrow">PASS IT ON</p><h1>List something<br><em>useful.</em></h1><p>Give your item a second life with someone on campus. Every listing is reviewed before it goes live.</p></div><form class="listing-form" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>What are you listing?<input name="title" required placeholder="e.g. Data Structures textbook"></label><div class="row g-3"><label class="col-md-6">Category<select name="category_id" required><option value="">-- Select Category --</option>{% for category in categories %}<option value="{{ category.id }}">{{ category.name }}</option>{% endfor %}</select></label><label class="col-md-6">Condition<select name="condition" required><option value="">-- Select Condition --</option><option value="Like New">Like New</option><option value="New">New</option><option value="Good">Good</option><option value="Fair">Fair</option><option value="Used">Used</option></select></label><label class="col-md-4">Price (₹)<input type="number" min="0" step="0.01" name="price" required></label><label class="col-md-4">Rental price/day (₹)<input type="number" min="0" step="0.01" name="rental_price"></label><label class="col-md-4">Listing type<select name="listing_type" required><option value="">-- Select Type --</option><option value="sale">Sell</option><option value="rent">Rent</option><option value="both">Sell & rent</option></select></label></div><label>Description<textarea name="description" rows="5" required placeholder="Condition details, what is included, and anything a buyer should know"></textarea></label><div class="row g-3"><label class="col-md-6">Pickup location<input name="location" required placeholder="e.g. Men's Hostel Block B"></label><label class="col-md-6">Availability<input name="availability" placeholder="e.g. Weekdays after 5pm"></label></div><label>Photos<input id="images" type="file" name="images" accept="image/png,image/jpeg,image/webp" multiple><span class="file-hint">Up to 5 MB per image. JPG, PNG or WEBP.</span></label><div id="preview" class="preview-grid"></div><button class="btn btn-ink">Submit for review <i class="fa-solid fa-arrow-right"></i></button></form></section>{% endblock %}
