{% extends 'base.html' %}{% block content %}<section class="container dashboard-page"><p class="eyebrow">YOUR ACTIVITY</p><h1>Rental history</h1>{% for rental in rentals %}<div class="activity-row"><strong>{{ rental.product.title }}</strong><span>{{ rental.start_date }} → {{ rental.end_date }}</span><b class="status">{{ rental.status }}</b></div>{% else %}<div class="empty-state">No rentals yet.</div>{% endfor %}</section>{% endblock %}
