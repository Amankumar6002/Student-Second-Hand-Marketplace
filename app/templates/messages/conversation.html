{% extends 'base.html' %}{% block content %}<section class="container dashboard-page narrow"><a class="text-link" href="{{ url_for('messages.inbox') }}">← Inbox</a><p class="eyebrow mt-4">CONVERSATION</p><h1>{{ other.name }}</h1><div class="chat">{% for item in messages %}<div class="bubble {{ 'mine' if item.sender_id == current_user.id else '' }}">{{ item.message }}<small>{{ item.created_at.strftime('%d %b, %H:%M') }}</small></div>{% endfor %}</div><form method="post" class="message-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><textarea name="message" required placeholder="Write a message..."></textarea><button class="btn btn-ink">Send</button></form></section>{% endblock %}
