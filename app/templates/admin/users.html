{% extends 'base.html' %}{% block content %}<section class="container dashboard-page"><p class="eyebrow">ADMIN CONSOLE</p><h1>Student accounts</h1>{% for user in users %}<div class="activity-row"><div><strong>{{ user.name }}</strong><span>{{ user.university_email }} · {{ user.registration_number }}</span></div><div class="inline-actions">{% if not user.is_verified %}<form method="post" action="{{ url_for('admin.moderate_user', user_id=user.id, action='verify') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-small">Verify</button></form>{% endif %}<form method="post" action="{{ url_for('admin.moderate_user', user_id=user.id, action='suspend' if user.is_active else 'activate') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-small">{{ 'Suspend' if user.is_active else 'Activate' }}</button></form></div></div>{% endfor %}</section>{% endblock %}
