{% extends 'base.html' %}{% block content %}<section class="container dashboard-page narrow"><p class="eyebrow">ADMIN CONSOLE</p><h1>Categories</h1><form method="post" class="inline-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="name" required placeholder="New category"><input name="description" placeholder="Description"><button class="btn btn-ink">Add</button></form>{% for category in categories %}<div class="activity-row"><strong>{{ category.name }}</strong><span>{{ category.description or '' }}</span></div>{% endfor %}</section>{% endblock %}
