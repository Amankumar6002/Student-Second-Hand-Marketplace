{% extends 'base.html' %}{% block content %}<section class="container dashboard-page"><p class="eyebrow">ADMIN CONSOLE</p><h1>Reported listings</h1>{% for report in reports %}<div class="activity-row"><div><strong>{{ report.product.title }}</strong><span>{{ report.reason }} · {{ report.description or 'No details provided' }}</span></div><a class="text-link" href="{{ url_for('products.detail', product_id=report.product.id) }}">Review <i class="fa-solid fa-arrow-right"></i></a></div>{% else %}<div class="empty-state">No reports filed.</div>{% endfor %}</section>{% endblock %}
